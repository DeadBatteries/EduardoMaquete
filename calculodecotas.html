<!DOCTYPE html>
<html lang="pt-br">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Cotas</title>
    <link rel= "stylesheet" href = "cssnew/calculadoradeescala.css">

</head>

<body>
    
    <h1>Calculadora de Cotas</h1>

     <div class = "formCotas">

        <label for = "cotaBase">Digite A Cota Base: </label>

        <input type = "number" id = "cotaBase"> <br>

        <label for = "novasCotas" id="labelnovascotas">Digite A Cota: </label>
        <input type = "number" id = "novasCotas">

        <button id = "calcularbutton"> Calcular</button>

       <div id = "cotasguia">
        
        <label for = "escalas">Selecione a Escala: </label>

        <input type = "radio" value = "0.2" name = "escalas" id="escala1">1/500
        <input type = "radio" value = "0.33" name = "escalas" id="escala2">1/300
        <input type = "radio" value = "0.4" name = "escalas" id="escala3">1/250
        <input type = "radio" value = "0.5" name = "escalas" id="escala4">1/200
        <input type = "radio" value = "0.66"  name = "escalas" id="escala5">1/150
        <input type = "radio" value = "1" name = "escalas"id="escala6">1/100
        <input type = "radio" value = "1.33" name = "escalas" id="escala7">1/75
        <input type = "radio" value = "2" name = "escalas" id ="escala8">1/50
        <input type = "radio" value = "2.33" name = "escalas" id = "escala9">1/43
        <input type = "radio" value = "3.03" name = "escalas" id = "escala10">1/33


        <div id = "valor-do-metro-div" hidden>

        <!--condicional valor do metro-->
            <label for = "valordometro" > Valor do Metro: </label>
            <input type = "number" id = "valordometro" placeholder="Digite o Valor Do Metro" > 
                
        </div>

        <div id = "button-valor-do-metro">

            <button type="button" id="show-valor-do-metro">Digitar Manualmente: 
            </button>

        </div>
       



       


     <div class = "containerCotas">

     </div>


    <script src = "js/calculadoradeescala.js" defer></script>

</body>

</html>
